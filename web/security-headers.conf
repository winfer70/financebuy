# Shared security header snippet — included wherever nginx.conf needs these
# headers, since any location-level add_header resets inheritance from the
# enclosing server block (see note in nginx.conf).

# Prevent clickjacking — the SPA does not need to be embedded in iframes.
add_header X-Frame-Options "DENY" always;
# Prevent MIME-type sniffing.
add_header X-Content-Type-Options "nosniff" always;
# Referrer policy — send full URL only to same origin, stripped elsewhere.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Disable browser APIs this app does not use.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Content Security Policy (mirrors host-nginx config; adjust if frontend
# adds new external dependencies). Must stay on a single line - HTTP headers
# do not support line folding.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://query2.finance.yahoo.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
