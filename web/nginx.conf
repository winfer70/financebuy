# TickerTap containerized web tier — serves the built frontend SPA and
# reverse-proxies API/health traffic to the `app` container.
#
# TLS is intentionally NOT handled here: Cloudflare Tunnel terminates TLS at
# Cloudflare's edge and forwards plain HTTP to this container over the
# tickertap_net Docker network. There is no direct internet path to this
# container's port — cloudflared is the only ingress.
#
# Security headers are preserved from the previous host-nginx config
# (nginx/tickerTap.conf) since Cloudflare passes the client request through;
# HSTS/CSP/etc. still apply to what the browser receives.

server {
    listen 80;
    server_name ticker-tap.com www.ticker-tap.com _;

    root  /usr/share/nginx/html;
    index index.html;

    # Prevent clickjacking — the SPA does not need to be embedded in iframes.
    add_header X-Frame-Options "DENY" always;
    # Prevent MIME-type sniffing.
    add_header X-Content-Type-Options "nosniff" always;
    # Referrer policy — send full URL only to same origin, stripped elsewhere.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Disable browser APIs this app does not use.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Content Security Policy (mirrors host-nginx config; adjust if frontend
    # adds new external dependencies).
    add_header Content-Security-Policy "
        default-src 'self';
        script-src  'self';
        style-src   'self' 'unsafe-inline';
        img-src     'self' data: https:;
        font-src    'self';
        connect-src 'self' https://query2.finance.yahoo.com;
        frame-ancestors 'none';
        base-uri    'self';
        form-action 'self';
    " always;

    client_max_body_size 1m;

    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    90s;

    # ── API routes → FastAPI backend (container-to-container) ───────────────
    location /api/ {
        proxy_pass         http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # ── Health check → FastAPI backend ───────────────────────────────────────
    location = /health {
        proxy_pass         http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # ── Static assets (JS/CSS chunks with content hash) ──────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA fallback — all other paths serve index.html ──────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
