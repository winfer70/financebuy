# docker-compose.prod.yml — LEGACY TickerTap production service definitions.
#
# SUPERSEDED: current production deploys use docker-compose.labserver.yml,
# which is self-contained (adds trading-ml, a containerized web tier, and
# Cloudflare Tunnel — see that file's header). This file predates that setup
# and pairs with the also-legacy deploy.sh (host nginx + certbot). Kept for
# reference; use docker-compose.labserver.yml for a new deployment host.
#
# Key differences from docker-compose.yml (dev):
#   - Port 8000 bound to 0.0.0.0 (LAN-accessible for the remote worker host)
#   - restart: always (auto-restart on reboot)
#   - No bind-mount volumes on app (runs from built image only)
#
# Usage:
#   POSTGRES_USER=postgres POSTGRES_PASSWORD=your_secure_password_here \
#     docker compose -f docker-compose.prod.yml up -d --build

networks:
  tickertap_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.50.0.0/16

services:
  db:
    image: timescale/timescaledb:latest-pg15
    restart: always
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB:       ${POSTGRES_DB:-tickerTap}
    volumes:
      - db_data:/var/lib/postgresql/data
    # No 'ports:' section — db is only reachable within tickertap_net.
    networks:
      - tickertap_net
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout:  5s
      retries:  5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # No 'ports:' section — redis is only reachable within tickertap_net.
    networks:
      - tickertap_net
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M

  app:
    build:
      context:    .
      dockerfile: backend/Dockerfile
    restart: always
    env_file:
      - ./backend/.env
    environment:
      # Use Docker service hostnames — not host networking.
      DATABASE_URL:    postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tickerTap}
      REDIS_URL:       redis://redis:6379/0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,https://ticker-tap.com}
      SMTP_HOST:       ${SMTP_HOST:-smtp.example.com}
      OLLAMA_URL:      ${OLLAMA_URL:-http://host.docker.internal:11434}
      ADMIN_EMAILS:    ${ADMIN_EMAILS:-}
    # Map host.docker.internal to the host machine IP (automatic on
    # Mac/Windows but requires this explicit mapping on Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Bind to all interfaces — the remote worker host connects via the
    # configured API URL.
    ports:
      - "0.0.0.0:8000:8000"
    networks:
      - tickertap_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  alert-worker:
    build:
      context:    .
      dockerfile: backend/Dockerfile
    restart: always
    command: ["arq", "app.trading.alert_worker.WorkerSettings"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.trading.worker_healthcheck", "alert-worker", "600"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL:    postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tickerTap}
      REDIS_URL:       redis://redis:6379/0
      # Workers never own schema changes — only app runs alembic.
      # This lets workers start safely even if their baked image predates
      # the latest migration files.
      SKIP_MIGRATIONS: "1"
    networks:
      - tickertap_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

volumes:
  db_data:
